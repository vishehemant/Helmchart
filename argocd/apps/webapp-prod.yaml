apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-prod
  namespace: argocd
  labels:
    environment: prod
    app: webapp
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: prod-alerts
    notifications.argoproj.io/subscribe.on-sync-failed.slack: prod-alerts
    notifications.argoproj.io/subscribe.on-health-degraded.slack: prod-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: webapp-project

  source:
    repoURL: https://github.com/YOUR_ORG/helm-argo-cd-gitops.git
    targetRevision: main
    path: helm-charts/webapp
    helm:
      valueFiles:
        - ../../environments/prod/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-prod

  # PRODUCTION: Manual sync only -- no automated sync.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - Validate=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
