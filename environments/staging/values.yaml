# =============================================================================
# STAGING Environment Values
# =============================================================================
# Mirrors production configuration with lower resource limits.
# Used for pre-release testing and QA validation.

replicaCount: 2

image:
  repository: myregistry.azurecr.io/webapp
  tag: "staging-latest"
  pullPolicy: IfNotPresent

configMap:
  enabled: true
  data:
    APP_ENV: "staging"
    LOG_LEVEL: "info"
    FEATURE_FLAG_NEW_UI: "true"
    DB_HOST: "postgres-staging.default.svc.cluster.local"
    DB_PORT: "5432"
    DB_NAME: "webapp_staging"
    CACHE_TTL: "300"

secret:
  enabled: true
  data:
    DB_PASSWORD: "staging-secret-password"
    API_KEY: "staging-api-key-67890"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: webapp.staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: webapp-staging-tls
      hosts:
        - webapp.staging.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

persistence:
  enabled: true
  storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /data

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
